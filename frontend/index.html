<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NerfSQL Console</title>
  <link rel="stylesheet" href="/frontend/styles.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">N</span><span>NerfSQL</span><small>CONSOLE</small></div>
      <div class="side-label">Workspace</div>
      <button class="nav active" data-view="query"><span>01</span> Query studio</button>
      <button class="nav" data-view="connections"><span>02</span> Connections</button>
      <button class="nav" data-view="providers"><span>03</span> AI providers</button>
      <button class="nav" data-view="history"><span>04</span> Run history</button>
      <div class="sidebar-footer"><span class="status-dot"></span><span>API connected</span><code id="apiUrl">127.0.0.1:8000</code></div>
    </aside>
    <main class="main">
      <header class="topbar"><div><span class="eyebrow">AGENTIC TEXT TO SQL</span><h1 id="pageTitle">Query studio</h1></div><div class="top-actions"><button class="ghost" id="healthBtn">Check health</button><span class="health" id="healthState">Unknown</span></div></header>
